<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Create Trip - Traveloop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#f3f4f6;display:flex;color:#111827}
.sidebar{width:260px;height:100vh;background:#1e3a8a;color:#fff;padding:30px 20px;position:fixed;left:0;top:0;overflow-y:auto}
.logo{font-size:32px;font-weight:bold;margin-bottom:36px}
.menu{list-style:none}.menu li{margin:18px 0}.menu a{color:#fff;text-decoration:none;font-size:18px;padding:12px;display:block;border-radius:10px}.menu a:hover{background:rgba(255,255,255,.2)}
.main{margin-left:260px;width:calc(100% - 260px);padding:40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}
.topbar h1{font-size:38px}.topbar p{color:#6b7280;margin-top:8px}
.ghost-btn,.save-btn{border:none;border-radius:12px;padding:14px 22px;font-weight:bold;cursor:pointer}
.ghost-btn{background:#e5e7eb;color:#111827}.save-btn{background:#2563eb;color:#fff}.save-btn:disabled{opacity:.65;cursor:not-allowed}
.layout{display:grid;grid-template-columns:2fr 1fr;gap:28px;align-items:start}
.panel{background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.panel h2{margin-bottom:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.input-group{display:flex;flex-direction:column;gap:9px}.input-group label{font-weight:bold;color:#374151}
.input-group input,.input-group select,.input-group textarea{border:1px solid #d1d5db;border-radius:12px;padding:14px;font-size:15px}
.input-group textarea{min-height:130px;resize:vertical}.full{grid-column:1/3}
.preview img{width:100%;height:220px;object-fit:cover;border-radius:16px;margin-bottom:20px;background:#e5e7eb}
.meta{display:grid;gap:14px}.meta div{background:#eff6ff;border-radius:12px;padding:15px}.meta strong{display:block;color:#2563eb;margin-bottom:5px}
@media(max-width:900px){.sidebar{display:none}.main{margin-left:0;width:100%;padding:22px}.layout,.form-grid{grid-template-columns:1fr}.full{grid-column:1}.topbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="logo">Traveloop</div>
  <ul class="menu">
    <li><a href="Dashboard.html">Dashboard</a></li>
    <li><a href="Create-Trip.html">Create Trip</a></li>
    <li><a href="My-Trip.html">My Trips</a></li>
    <li><a href="Itinerary.html">Build Itinerary</a></li>
    <li><a href="Profile.html">Profile</a></li>
    <li><a href="index.html">Logout</a></li>
  </ul>
</div>

<main class="main">
  <div class="topbar">
    <div>
      <h1>Create Trip</h1>
      <p>Set the basics now, then build the day-by-day itinerary next.</p>
    </div>
    <button class="ghost-btn" onclick="location.href='My-Trip.html'">View Trips</button>
  </div>

  <div class="layout">
    <form class="panel" id="tripForm">
      <h2>Trip Details</h2>
      <div class="form-grid">
        <div class="input-group">
          <label for="tripName">Trip Name</label>
          <input id="tripName" required placeholder="Bali Adventure">
        </div>
        <div class="input-group">
          <label for="destination">Destination</label>
          <input id="destination" placeholder="Bali, Indonesia">
        </div>
        <div class="input-group">
          <label for="startDate">Start Date</label>
          <input id="startDate" type="date">
        </div>
        <div class="input-group">
          <label for="endDate">End Date</label>
          <input id="endDate" type="date">
        </div>
        <div class="input-group">
          <label for="travelers">Travelers</label>
          <input id="travelers" type="number" min="1" value="1">
        </div>
        <div class="input-group">
          <label for="budget">Budget</label>
          <input id="budget" type="number" min="0" step="100" value="0">
        </div>
        <div class="input-group">
          <label for="status">Status</label>
          <select id="status">
            <option>Upcoming</option>
            <option>Planning</option>
            <option>Completed</option>
          </select>
        </div>
        <div class="input-group">
          <label for="coverPhoto">Cover Photo URL</label>
          <input id="coverPhoto" placeholder="https://images.unsplash.com/...">
        </div>
        <div class="input-group full">
          <label for="description">Description</label>
          <textarea id="description" placeholder="What kind of trip is this?"></textarea>
        </div>
      </div>
      <div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap">
        <button class="save-btn" id="submitBtn" type="submit">Create Trip</button>
        <button class="ghost-btn" type="reset">Clear</button>
      </div>
    </form>

    <aside class="panel preview">
      <h2>Live Preview</h2>
      <img id="previewImage" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="">
      <div class="meta">
        <div><strong id="previewName">Untitled Trip</strong><span id="previewDestination">Destination not set</span></div>
        <div><strong>Dates</strong><span id="previewDates">Not set</span></div>
        <div><strong>Budget</strong><span id="previewBudget">$0</span></div>
      </div>
    </aside>
  </div>
</main>

<script src="backend/traveloop.js"></script>
<script>
const fallbackImage = 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e';
const fields = ['tripName','destination','startDate','endDate','budget','coverPhoto'];

function updatePreview() {
  const name = document.getElementById('tripName').value.trim();
  const destination = document.getElementById('destination').value.trim();
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  const cover = document.getElementById('coverPhoto').value.trim();
  document.getElementById('previewName').textContent = name || 'Untitled Trip';
  document.getElementById('previewDestination').textContent = destination || 'Destination not set';
  document.getElementById('previewDates').textContent = start || end ? `${formatDate(start)} - ${formatDate(end)}` : 'Not set';
  document.getElementById('previewBudget').textContent = formatMoney(document.getElementById('budget').value);
  document.getElementById('previewImage').src = cover || fallbackImage;
}

async function createTrip(event) {
  event.preventDefault();
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Creating...';
  try {
    const response = await TravelLoopAPI.trips.create({
      name: document.getElementById('tripName').value.trim(),
      destination: document.getElementById('destination').value.trim(),
      start_date: document.getElementById('startDate').value || null,
      end_date: document.getElementById('endDate').value || null,
      travelers: Number(document.getElementById('travelers').value || 1),
      budget: Number(document.getElementById('budget').value || 0),
      description: document.getElementById('description').value.trim(),
      cover_photo: document.getElementById('coverPhoto').value.trim(),
      status: document.getElementById('status').value
    });
    showNotification('Trip created successfully.');
    window.location.href = `Itinerary.html?trip_id=${response.trip_id}`;
  } catch (error) {
    showNotification(error.message, false);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Create Trip';
  }
}

fields.forEach(id => document.getElementById(id).addEventListener('input', updatePreview));
document.getElementById('tripForm').addEventListener('submit', createTrip);
document.getElementById('tripForm').addEventListener('reset', () => setTimeout(updatePreview));
updatePreview();
</script>
</body>
</html>
