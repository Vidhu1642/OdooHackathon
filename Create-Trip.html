<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Trips - Traveloop</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:#f3f4f6;display:flex;}

/* SIDEBAR */
.sidebar{
  width:260px;height:100vh;background:#1e3a8a;color:#fff;
  padding:30px;position:fixed;
}
.logo{font-size:28px;font-weight:bold;margin-bottom:30px;}
.menu li{list-style:none;margin:15px 0;}
.menu a{color:#fff;text-decoration:none;padding:10px;display:block;border-radius:10px;}
.menu a:hover{background:rgba(255,255,255,0.2);}

/* MAIN */
.main{
  margin-left:260px;width:100%;padding:30px;
}

.topbar{
  display:flex;justify-content:space-between;margin-bottom:30px;
}

.trip-btn{
  background:#2563eb;color:#fff;border:none;padding:12px;border-radius:10px;
  cursor:pointer;
}

/* GRID */
.trip-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.trip-card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.trip-card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.trip-content{
  padding:15px;
}

.trip-content h3{
  margin-bottom:10px;
}

.trip-content p{
  color:#6b7280;
  margin-bottom:10px;
}

.budget{
  color:green;
  font-weight:bold;
}

.actions{
  margin-top:10px;
  display:flex;
  gap:10px;
}

.delete-btn{
  background:red;
  color:#fff;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}

.empty{
  text-align:center;
  margin-top:50px;
  font-size:18px;
  color:#6b7280;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">Traveloop</div>
  <ul class="menu">
    <li><a href="Dashboard.html">Dashboard</a></li>
    <li><a href="Create-Trip.html">Create Trip</a></li>
    <li><a href="My-Trip.html">My Trips</a></li>
  </ul>
</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <h1>My Trips 🧳</h1>
    <button class="trip-btn" onclick="window.location.href='Create-Trip.html'">
      + New Trip
    </button>
  </div>

  <div class="trip-grid" id="tripContainer"></div>

</div>

<script>
const BASE_URL = "http://localhost/Traveloop/backend";

// 🚀 LOAD TRIPS
async function loadTrips() {
  try {

    const res = await fetch(BASE_URL + "/trips.php?action=list", {
      method: "GET",
      credentials: "include"
    });

    const data = await res.json();

    if (!data.success) {
      alert(data.message);
      return;
    }

    const trips = data.trips;
    const container = document.getElementById("tripContainer");

    container.innerHTML = "";

    if (!trips || trips.length === 0) {
      container.innerHTML = "<div class='empty'>No trips yet ✈</div>";
      return;
    }

    trips.forEach(trip => {

      const days = Math.ceil(
        (new Date(trip.end_date) - new Date(trip.start_date)) /
        (1000 * 60 * 60 * 24)
      );

      const card = `
        <div class="trip-card">
          <img src="${trip.cover_photo || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e'}">

          <div class="trip-content">
            <h3>${trip.name}</h3>

            <p>${days} Days • ${trip.destination || "Unknown"}</p>

            <div class="budget">Budget: $${trip.budget}</div>

            <div class="actions">
              <button class="delete-btn" onclick="deleteTrip(${trip.id})">
                Delete
              </button>
            </div>
          </div>
        </div>
      `;

      container.innerHTML += card;
    });

  } catch (err) {
    console.error(err);
    alert("Error loading trips");
  }
}


// ❌ DELETE TRIP
async function deleteTrip(id) {

  if (!confirm("Are you sure you want to delete this trip?")) return;

  const res = await fetch(BASE_URL + "/trips.php?action=delete", {
    method: "POST",
    credentials: "include",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      trip_id: id
    })
  });

  const data = await res.json();
  alert(data.message);

  loadTrips();
}


// 🚀 INIT
document.addEventListener("DOMContentLoaded", loadTrips);
</script>

</body>
</html>
