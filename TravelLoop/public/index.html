<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Traveloop Login / Signup</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(to right,#dbeafe,#eff6ff);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:950px;
            background:white;
            border-radius:20px;
            overflow:hidden;
            display:flex;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        /* LEFT SIDE */
        .left-panel{
            width:45%;
            background:linear-gradient(to bottom right,#2563eb,#1e40af);
            color:white;
            padding:60px 40px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .left-panel h1{
            font-size:42px;
            margin-bottom:20px;
        }

        .left-panel p{
            font-size:18px;
            line-height:1.7;
        }

        .travel-image{
            margin-top:40px;
            width:100%;
            border-radius:15px;
        }

        /* RIGHT SIDE */
        .right-panel{
            width:55%;
            padding:40px;
        }

        .tabs{
            display:flex;
            margin-bottom:30px;
        }

        .tab-btn{
            flex:1;
            padding:15px;
            border:none;
            cursor:pointer;
            font-size:18px;
            font-weight:bold;
            background:#e5e7eb;
            transition:0.3s;
        }

        .tab-btn.active{
            background:#2563eb;
            color:white;
        }

        .form-container{
            margin-top:20px;
        }

        .form{
            display:none;
        }

        .form.active{
            display:block;
        }

        .form h2{
            margin-bottom:25px;
            color:#111827;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#374151;
        }

        .input-group input{
            width:100%;
            padding:14px;
            border:1px solid #d1d5db;
            border-radius:10px;
            font-size:16px;
        }

        .input-group input:focus{
            border-color:#2563eb;
            outline:none;
        }

        .btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        .forgot{
            text-align:right;
            margin-top:10px;
        }

        .forgot a{
            text-decoration:none;
            color:#2563eb;
            font-size:14px;
        }

        .social-login{
            margin-top:30px;
            text-align:center;
        }

        .social-login p{
            margin-bottom:15px;
            color:#6b7280;
        }

        .social-buttons{
            display:flex;
            gap:10px;
        }

        .social-buttons button{
            flex:1;
            padding:12px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        }

        .google{
            background:#ef4444;
            color:white;
        }

        .facebook{
            background:#1877f2;
            color:white;
        }

        @media(max-width:900px){

            .container{
                flex-direction:column;
                width:90%;
            }

            .left-panel,
            .right-panel{
                width:100%;
            }

            .left-panel{
                text-align:center;
            }
        }

    </style>
</head>
<body>

    <div class="container">

        <!-- LEFT PANEL -->
        <div class="left-panel">
            <h1>Traveloop</h1>

            <p>
                Personalized Travel Planning Made Easy.
                Plan multi-city trips, manage budgets,
                explore destinations, and organize
                your dream journey effortlessly.
            </p>

            <img 
                src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                class="travel-image"
                alt="Travel"
            >
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">

            <!-- TABS -->
            <div class="tabs">
                <button class="tab-btn active" onclick="showLogin()">
                    Login
                </button>

                <button class="tab-btn" onclick="showSignup()">
                    Signup
                </button>
            </div>

            <!-- LOGIN FORM -->
            <div class="form-container">

                <form class="form active" id="loginForm" onsubmit="handleLogin(event)">

                    <h2>Welcome Back</h2>

                    <div class="input-group">
                        <label>Email</label>
                        <input id="loginEmail" type="email" placeholder="Enter your email">
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input id="loginPassword" type="password" placeholder="Enter your password">
                    </div>

                    <button type="submit" class="btn">
                        Login
                    </button>

                    <div class="forgot">
                        <a href="#">Forgot Password?</a>
                    </div>

                </form>

                <!-- SIGNUP FORM -->
                <form class="form" id="signupForm" onsubmit="handleSignup(event)">

                    <h2>Create Account</h2>

                    <div class="input-group">
                        <label>Full Name</label>
                        <input id="signupFullName" type="text" placeholder="Enter your full name">
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input id="signupEmail" type="email" placeholder="Enter your email">
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input id="signupPassword" type="password" placeholder="Create password">
                    </div>

                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input id="signupConfirmPassword" type="password" placeholder="Confirm password">
                    </div>

                    <button type="submit" class="btn">
                        Create Account
                    </button>

                </form>

            </div>

            <!-- SOCIAL LOGIN -->
            <div class="social-login">

                <p>Or continue with</p>

                <div class="social-buttons">

                    <button class="google">
                        Google
                    </button>

                    <button class="facebook">
                        Facebook
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="backend/traveloop.js"></script>
    <script>

        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");

        const tabButtons = document.querySelectorAll(".tab-btn");

        function showLogin(){

            loginForm.classList.add("active");
            signupForm.classList.remove("active");

            tabButtons[0].classList.add("active");
            tabButtons[1].classList.remove("active");
        }

        function showSignup(){

            signupForm.classList.add("active");
            loginForm.classList.remove("active");

            tabButtons[1].classList.add("active");
            tabButtons[0].classList.remove("active");
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!email || !password) {
                return showNotification('Please enter both email and password.', false);
            }

            try {
                await TravelLoopAPI.auth.login(email, password);
                showNotification('Login successful. Redirecting...');
                window.location.href = 'My-Trip.html';
            } catch (error) {
                showNotification(error.message, false);
            }
        }

        async function handleSignup(event) {
            event.preventDefault();
            const fullName = document.getElementById('signupFullName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            const confirmPassword = document.getElementById('signupConfirmPassword').value.trim();

            if (!fullName || !email || !password || !confirmPassword) {
                return showNotification('Please complete all fields.', false);
            }

            if (password !== confirmPassword) {
                return showNotification('Passwords do not match.', false);
            }

            try {
                await TravelLoopAPI.auth.register(fullName, email, password);
                showNotification('Account created. Redirecting...');
                window.location.href = 'My-Trip.html';
            } catch (error) {
                showNotification(error.message, false);
            }
        }

        function showSignup(){

            signupForm.classList.add("active");
            loginForm.classList.remove("active");

            tabButtons[1].classList.add("active");
            tabButtons[0].classList.remove("active");
        }

    </script>

</body>
</html>
