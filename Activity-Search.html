<!-- =========================================
SCREEN 8 : ACTIVITY SEARCH SCREEN
Traveloop Hackathon Project
Connected with City Search
========================================== -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Activity Search - Traveloop</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f3f4f6;
      display:flex;
    }

    /* SIDEBAR */

    .sidebar{
      width:260px;
      height:100vh;
      background:#1e3a8a;
      color:white;
      padding:30px 20px;
      position:fixed;
      left:0;
      top:0;
      overflow-y:auto;
    }

    .sidebar::-webkit-scrollbar{
      width:6px;
    }

    .sidebar::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,0.3);
      border-radius:10px;
    }

    .logo{
      font-size:32px;
      font-weight:bold;
      margin-bottom:40px;
    }

    .menu{
      list-style:none;
    }

    .menu li{
      margin:20px 0;
    }

    .menu a{
      color:white;
      text-decoration:none;
      font-size:18px;
      padding:12px;
      display:block;
      border-radius:10px;
      transition:0.3s;
    }

    .menu a:hover{
      background:rgba(255,255,255,0.2);
    }

    /* MAIN */

    .main{
      margin-left:260px;
      width:calc(100% - 260px);
      padding:40px;
    }

    /* HEADER */

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:40px;
      flex-wrap:wrap;
      gap:20px;
    }

    .topbar h1{
      font-size:38px;
      color:#111827;
    }

    .topbar p{
      color:#6b7280;
      margin-top:8px;
    }

    .view-trip-btn{
      background:#2563eb;
      color:white;
      border:none;
      padding:15px 25px;
      border-radius:12px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .view-trip-btn:hover{
      background:#1d4ed8;
    }

    /* SEARCH FILTER */

    .search-section{
      background:white;
      padding:30px;
      border-radius:25px;
      margin-bottom:35px;
      box-shadow:0 8px 20px rgba(0,0,0,0.08);
    }

    .search-grid{
      display:grid;
      grid-template-columns:2fr 1fr 1fr 1fr;
      gap:20px;
    }

    .search-grid input,
    .search-grid select{
      padding:16px;
      border:1px solid #d1d5db;
      border-radius:12px;
      font-size:15px;
    }

    .search-btn{
      background:#2563eb;
      color:white;
      border:none;
      padding:16px;
      border-radius:12px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    /* CATEGORY TAGS */

    .categories{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:20px;
    }

    .category{
      background:#dbeafe;
      color:#2563eb;
      padding:10px 18px;
      border-radius:25px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .category:hover{
      background:#2563eb;
      color:white;
    }

    /* ACTIVITY GRID */

    .activity-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:30px;
    }

    /* CARD */

    .activity-card{
      background:white;
      border-radius:25px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,0.08);
      transition:0.3s;
    }

    .activity-card:hover{
      transform:translateY(-6px);
    }

    .activity-image{
      position:relative;
    }

    .activity-image img{
      width:100%;
      height:240px;
      object-fit:cover;
    }

    .activity-type{
      position:absolute;
      top:15px;
      left:15px;
      background:white;
      color:#111827;
      padding:8px 14px;
      border-radius:20px;
      font-weight:bold;
      font-size:14px;
    }

    /* CONTENT */

    .activity-content{
      padding:25px;
    }

    .activity-content h2{
      color:#111827;
      margin-bottom:10px;
    }

    .activity-content p{
      color:#6b7280;
      line-height:1.7;
      margin-bottom:20px;
    }

    /* INFO */

    .activity-info{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      margin-bottom:25px;
    }

    .info-box{
      background:#eff6ff;
      padding:15px;
      border-radius:12px;
    }

    .info-box h4{
      color:#2563eb;
      margin-bottom:5px;
      font-size:14px;
    }

    .info-box span{
      font-weight:bold;
      color:#111827;
    }

    /* BUTTONS */

    .btn-group{
      display:flex;
      gap:12px;
    }

    .btn{
      flex:1;
      border:none;
      padding:14px;
      border-radius:12px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .details-btn{
      background:#e5e7eb;
      color:#111827;
    }

    .add-btn{
      background:#059669;
      color:white;
    }

    .btn:hover{
      opacity:0.9;
    }

    /* RESPONSIVE */

    @media(max-width:1000px){

      .sidebar{
        display:none;
      }

      .main{
        margin-left:0;
        width:100%;
      }

      .search-grid{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>
<body>
  <div class="main">
    <div class="topbar">
      <h1>Discover Activities 🎯</h1>
      <button class="view-trip-btn" onclick="location.href='My-Trip.html'">View My Trips</button>
    </div>

    <div class="search-section">
      <div class="search-grid">
        <input id="activitySearchQuery" type="text" placeholder="Search activities (e.g., Beach, Sushi)...">
        <button class="search-btn" onclick="searchActivity()">Search</button>
      </div>
    </div>

    <div class="activity-grid" id="activityResults">
      </div>
  </div>

  <script src="backend/traveloop.js"></script>
  <script>
    async function searchActivity() {
      const query = document.getElementById('activitySearchQuery').value.trim();
      if (!query) return alert('Please enter an activity name');

      try {
        const response = await TravelLoopAPI.search.query(query); //
        const grid = document.getElementById('activityResults');
        grid.innerHTML = '';

        if (!response.results.activities.length) {
            grid.innerHTML = '<p>No activities found matching your search.</p>';
            return;
        }

        response.results.activities.forEach(activity => {
          const card = document.createElement('div');
          card.className = 'activity-card';
          card.innerHTML = `
            <div class="activity-image">
              <img src="https://images.unsplash.com/photo-1519817650390-64a93db511aa">
              <div class="activity-type">${activity.category}</div>
            </div>
            <div class="activity-content">
              <h2>${activity.name}</h2>
              <p>${activity.description}</p>
              <div class="activity-info">
                <div class="info-box"><h4>Cost</h4><span>$${activity.cost}</span></div>
                <div class="info-box"><h4>Location</h4><span>${activity.location}</span></div>
              </div>
              <button class="add-btn" onclick="addActivity('${activity.name}')">Add Activity</button>
            </div>`;
          grid.appendChild(card);
        });
      } catch (e) { console.error(e); }
    }

    function addActivity(name) {
      alert(name + " added to your planning list!");
    }
  </script>
</body>
</html>
