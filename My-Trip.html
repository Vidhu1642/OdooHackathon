<!-- =========================================
SCREEN 4 : MY TRIPS SCREEN
Traveloop Hackathon Project
Connected with Create Trip Screen
========================================== -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Trips - Traveloop</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f3f4f6;
      display:flex;
    }

    /* SIDEBAR */

    .sidebar{
      width:260px;
      height:100vh;
      background:#1e3a8a;
      color:white;
      padding:30px 20px;
      position:fixed;
      left:0;
      top:0;
      overflow-y:auto;
    }

    .sidebar::-webkit-scrollbar{
      width:6px;
    }

    .sidebar::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,0.3);
      border-radius:10px;
    }

    .logo{
      font-size:32px;
      font-weight:bold;
      margin-bottom:40px;
    }

    .menu{
      list-style:none;
    }

    .menu li{
      margin:20px 0;
    }

    .menu a{
      color:white;
      text-decoration:none;
      font-size:18px;
      padding:12px;
      display:block;
      border-radius:10px;
      transition:0.3s;
    }

    .menu a:hover{
      background:rgba(255,255,255,0.2);
    }

    /* MAIN */

    .main{
      margin-left:260px;
      width:calc(100% - 260px);
      padding:40px;
    }

    /* HEADER */

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:40px;
    }

    .topbar h1{
      font-size:38px;
      color:#111827;
    }

    .topbar p{
      color:#6b7280;
      margin-top:8px;
    }

    .topbar button{
      background:#2563eb;
      color:white;
      border:none;
      padding:15px 25px;
      border-radius:12px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .topbar button:hover{
      background:#1d4ed8;
    }

    /* FILTERS */

    .filters{
      display:flex;
      gap:20px;
      margin-bottom:30px;
      flex-wrap:wrap;
    }

    .filters input,
    .filters select{
      padding:14px;
      border:1px solid #d1d5db;
      border-radius:12px;
      font-size:15px;
      min-width:220px;
    }

    /* TRIP GRID */

    .trip-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
      gap:30px;
    }

    /* TRIP CARD */

    .trip-card{
      background:white;
      border-radius:25px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,0.08);
      transition:0.3s;
    }

    .trip-card:hover{
      transform:translateY(-6px);
    }

    .trip-image{
      position:relative;
    }

    .trip-image img{
      width:100%;
      height:240px;
      object-fit:cover;
    }

    .trip-status{
      position:absolute;
      top:15px;
      right:15px;
      background:#059669;
      color:white;
      padding:8px 14px;
      border-radius:20px;
      font-size:13px;
      font-weight:bold;
    }

    .trip-content{
      padding:25px;
    }

    .trip-content h2{
      color:#111827;
      margin-bottom:10px;
    }

    .trip-content p{
      color:#6b7280;
      line-height:1.7;
      margin-bottom:20px;
    }

    /* INFO */

    .trip-info{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      margin-bottom:25px;
    }

    .info-box{
      background:#eff6ff;
      padding:15px;
      border-radius:12px;
    }

    .info-box h4{
      color:#2563eb;
      margin-bottom:5px;
      font-size:14px;
    }

    .info-box span{
      font-weight:bold;
      color:#111827;
    }

    /* BUTTONS */

    .btn-group{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .btn{
      flex:1;
      border:none;
      padding:12px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
      transition:0.3s;
    }

    .view-btn{
      background:#2563eb;
      color:white;
    }

    .edit-btn{
      background:#f59e0b;
      color:white;
    }

    .delete-btn{
      background:#ef4444;
      color:white;
    }

    .btn:hover{
      opacity:0.9;
    }

    /* EMPTY STATE */

    .empty{
      background:white;
      padding:50px;
      text-align:center;
      border-radius:20px;
      margin-top:40px;
      display:none;
    }

    .empty h2{
      color:#111827;
      margin-bottom:15px;
    }

    .empty p{
      color:#6b7280;
      margin-bottom:20px;
    }

    .empty button{
      background:#2563eb;
      color:white;
      border:none;
      padding:14px 24px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
    }

    /* RESPONSIVE */

    @media(max-width:900px){

      .sidebar{
        display:none;
      }

      .main{
        margin-left:0;
        width:100%;
        padding:20px;
      }

      .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:20px;
      }

    }

  </style>
</head>
<body>
  <div class="main">
    <div class="topbar">
      <h1>My Trips ✈</h1>
      <button onclick="location.href='Create-Trip.html'">+ Create New Trip</button>
    </div>

    <div class="trip-grid" id="tripGrid"></div>
    <div class="empty" id="emptyState"><h2>No Trips Available</h2></div>
  </div>

  <script src="backend/traveloop.js"></script>
  <script>
    async function loadTrips() {
      try {
        const res = await TravelLoopAPI.trips.list(); //
        const grid = document.getElementById('tripGrid');
        const empty = document.getElementById('emptyState');
        
        if (!res.trips || res.trips.length === 0) {
          empty.style.display = 'block';
          grid.innerHTML = '';
          return;
        }

        empty.style.display = 'none';
        grid.innerHTML = res.trips.map(trip => `
          <div class="trip-card">
            <div class="trip-image">
              <img src="${escapeHtml(trip.cover_photo || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e')}" />
              <div class="trip-status">${escapeHtml(trip.status || 'Upcoming')}</div>
            </div>
            <div class="trip-content">
              <h2>${escapeHtml(trip.name)}</h2>
              <p>${escapeHtml(trip.description || 'No description added yet.')}</p>
              <div class="trip-info">
                <div class="info-box"><h4>Budget</h4><span>${formatMoney(trip.budget)}</span></div>
                <div class="info-box"><h4>Destination</h4><span>${escapeHtml(trip.destination || 'Not set')}</span></div>
                <div class="info-box"><h4>Dates</h4><span>${formatDate(trip.start_date)}</span></div>
                <div class="info-box"><h4>Travelers</h4><span>${Number(trip.travelers || 1)}</span></div>
              </div>
              <div class="btn-group">
                <button class="btn view-btn" onclick="location.href='Itinerary-View.html?trip_id=${trip.id}'">View</button>
                <button class="btn edit-btn" onclick="location.href='Itinerary.html?trip_id=${trip.id}'">Itinerary</button>
                <button class="btn delete-btn" onclick="deleteTrip(${trip.id})">Delete</button>
              </div>
            </div>
          </div>
        `).join(''); //
      } catch (err) {
        showNotification(err.message, false);
      }
    }

    async function deleteTrip(id) {
      if (confirm('Delete this trip permanently?')) {
        await TravelLoopAPI.trips.delete(id); //
        showNotification('Trip deleted.');
        loadTrips();
      }
    }

    document.addEventListener('DOMContentLoaded', loadTrips);
  </script>
</body>
</html>
