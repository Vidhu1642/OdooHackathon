<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trip Notes & Journal - Traveloop</title>
  <style>
    /* ... (All your existing CSS styles remain exactly the same) ... */
    *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif; }
    body{ background:#f3f4f6; display:flex; }
    .sidebar{ width:260px; height:100vh; background:#1e3a8a; color:white; padding:30px 20px; position:fixed; left:0; top:0; overflow-y:auto; }
    .logo{ font-size:32px; font-weight:bold; margin-bottom:40px; }
    .menu{ list-style:none; }
    .menu li{ margin:20px 0; }
    .menu a{ color:white; text-decoration:none; font-size:18px; padding:12px; display:block; border-radius:10px; transition:0.3s; }
    .menu a:hover{ background:rgba(255,255,255,0.2); }
    .main{ margin-left:260px; width:calc(100% - 260px); padding:40px; }
    .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; flex-wrap:wrap; gap:20px; }
    .topbar h1{ font-size:38px; color:#111827; }
    .new-note-btn{ background:#2563eb; color:white; border:none; padding:15px 25px; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; transition:0.3s; }
    .notes-layout{ display:grid; grid-template-columns:1fr 2fr; gap:30px; }
    .notes-sidebar{ background:white; border-radius:25px; padding:25px; box-shadow:0 8px 20px rgba(0,0,0,0.08); height:fit-content; }
    .search-box input{ width:100%; padding:15px; border:1px solid #d1d5db; border-radius:12px; margin-bottom:20px; }
    .note-item{ background:#f9fafb; padding:18px; border-radius:15px; margin-bottom:15px; cursor:pointer; transition:0.3s; border-left:5px solid transparent; }
    .note-item:hover, .active-note{ background:#dbeafe; border-left:5px solid #2563eb; }
    .editor{ background:white; border-radius:25px; padding:35px; box-shadow:0 8px 20px rgba(0,0,0,0.08); }
    .editor-header{ display:flex; gap:20px; margin-bottom:25px; }
    .editor-header input{ flex:1; padding:16px; border:1px solid #d1d5db; border-radius:12px; font-size:20px; font-weight:bold; }
    .editor textarea{ width:100%; height:420px; border:1px solid #d1d5db; border-radius:15px; padding:20px; font-size:16px; line-height:1.8; resize:none; }
    .btn{ border:none; padding:14px 22px; border-radius:12px; font-weight:bold; cursor:pointer; }
    .save-btn{ background:#059669; color:white; }
    .delete-btn{ background:#ef4444; color:white; }
    .quick-notes{ margin-top:35px; background:#eff6ff; padding:25px; border-radius:20px; }
    .quick-tags{ display:flex; flex-wrap:wrap; gap:12px; margin-top:15px; }
    .tag{ background:white; color:#2563eb; padding:10px 18px; border-radius:20px; cursor:pointer; font-weight:bold; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="logo">Traveloop</div>
    <ul class="menu">
      <li><a href="Dashboard.html">🏠 Dashboard</a></li>
      <li><a href="Trip-Notes.html">📝 Trip Notes</a></li>
      <li><a href="index.html">🚪 Logout</a></li>
    </ul>
  </div>

 <div class="notes-layout">
    <div class="notes-sidebar">
        <div class="search-box"><input type="text" placeholder="Search notes..."></div>
        <div id="noteList"></div> </div>

    <div class="editor">
        <div class="editor-header">
            <input id="noteTitle" type="text" placeholder="Note title">
            <div class="editor-actions">
                <button class="btn save-btn" onclick="handleSave()">Save</button>
                <button class="btn delete-btn" onclick="handleDelete()">Delete</button>
            </div>
        </div>
        <textarea id="noteBody" placeholder="Travel memories..."></textarea>
    </div>
</div>

<script src="backend/traveloop.js"></script>
<script>
    let currentNoteId = null;

    async function handleSave() {
        const title = document.getElementById('noteTitle').value;
        const body = document.getElementById('noteBody').value;
        
        try {
            if (currentNoteId) {
                await TravelLoopAPI.notes.update({ note_id: currentNoteId, title, body }); //
            } else {
                const res = await TravelLoopAPI.notes.create({ title, body, trip_id: null }); //
                currentNoteId = res.note_id;
            }
            alert("Note Saved!");
            location.reload(); 
        } catch (err) { alert(err.message); }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const res = await TravelLoopAPI.notes.list(); //
        const list = document.getElementById('noteList');
        list.innerHTML = res.notes.map(n => `
            <div class="note-item" onclick="loadNote(${n.id}, '${n.title}', '${n.body}')">
                <h3>${n.title}</h3>
                <p>${n.body.substring(0, 30)}...</p>
            </div>
        `).join('');
    });

    function loadNote(id, title, body) {
        currentNoteId = id;
        document.getElementById('noteTitle').value = title;
        document.getElementById('noteBody').value = body;
    }
</script>


 
</body>
</html>
